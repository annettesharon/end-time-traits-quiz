<!doctype html>
<html lang="en">
<head>

<title>18 End Time Traits Bible Quiz</title>
<style>
  :root{
    --navy:#31406d;--navy2:#4858a8;--gold:#dcae3e;--cream:#fffaf3;--ink:#1d2742;
    --muted:#66718b;--card:#ffffff;--line:#e7e9f3;--good:#16794d;--bad:#b63d3d;--shadow:0 12px 30px rgba(40,53,94,.12);--radius:22px;
  }
  *{box-sizing:border-box} html{scroll-behavior:smooth}
  body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","Nirmala UI","Noto Sans Tamil",Latha,sans-serif;background:
      radial-gradient(circle at top left, rgba(252,214,221,.55), transparent 26%),
      radial-gradient(circle at top right, rgba(223,232,255,.8), transparent 26%),
      linear-gradient(180deg,#f7f8ff 0,#fff 42%,#fffaf2 100%);color:var(--ink);min-height:100vh}
  a{color:inherit;text-decoration:none}
  button{font:inherit} .app{max-width:1160px;margin:auto;padding:18px 18px 56px}
  .topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;padding:10px 0;background:rgba(247,248,255,.9);backdrop-filter:blur(12px)}
  .brand{display:flex;align-items:center;gap:10px;cursor:pointer}
  .brandmark{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,var(--navy2),#7d8de0);display:grid;place-items:center;color:#fff;font-weight:900;box-shadow:var(--shadow)}
  .brandtext b{display:block;line-height:1.05} .brandtext small{color:var(--muted)}
  .topactions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .pill,.btn,.linkbtn{border:0;border-radius:999px;padding:10px 14px;cursor:pointer;transition:.2s ease}
  .pill{background:#fff;border:1px solid var(--line);color:var(--ink)} .pill.active{background:var(--navy2);color:#fff;border-color:var(--navy2)}
  .pill:hover,.btn:hover,.linkbtn:hover{transform:translateY(-1px)}
  .xp{background:#fff7db;border:1px solid #f0d275;color:#7b5a00;font-weight:800}
  .btn,.linkbtn{font-weight:800;background:var(--navy2);color:#fff;box-shadow:0 8px 18px rgba(72,88,168,.18)}
  .btn.secondary,.linkbtn.secondary{background:#fff;color:var(--navy2);border:1px solid #ccd3ee;box-shadow:none}
  .btn.gold{background:var(--gold);color:#2d2406} .btn.good{background:var(--good)} .btn.bad{background:var(--bad)}
  .hero{margin:26px 0 22px;background:linear-gradient(135deg,#5567c3,var(--navy));color:#fff;border-radius:34px;padding:34px;box-shadow:var(--shadow);overflow:hidden;position:relative}
  .hero:before{content:"";position:absolute;inset:auto -40px -50px auto;width:220px;height:220px;background:radial-gradient(circle, rgba(255,255,255,.14), transparent 65%);border-radius:50%}
  .hero:after{content:"✦";position:absolute;right:26px;bottom:-10px;font-size:96px;color:rgba(255,255,255,.08);transform:rotate(18deg)}
  .eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.78rem;font-weight:900;color:#f5df95}
  .hero h1{font-size:clamp(2rem,5vw,3.6rem);line-height:1;margin:.3em 0 .25em} .hero p{max-width:760px;color:#e8edff;font-size:1.05rem;line-height:1.65;margin:0}
  .hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px} .hero .btn.secondary{background:rgba(255,255,255,.13);color:#fff;border-color:rgba(255,255,255,.28)}
  .section-title{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:28px 2px 14px} .section-title h2{margin:0;font-size:1.35rem} .section-title p{margin:0;color:var(--muted);font-size:.93rem}
  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 24px rgba(31,45,85,.07);overflow:hidden;display:flex;flex-direction:column;position:relative}
  .card::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--accent)}
  .card-cover{aspect-ratio:16/10;background:linear-gradient(180deg,var(--accent2),#fff);display:grid;place-items:center;padding:8px 8px 0;overflow:hidden}
  .card-cover img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 6px 12px rgba(0,0,0,.06))}
  .card-body{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}
  .lesson-num{font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--navy2);font-weight:900} .card h3{margin:0;font-size:1.22rem}
  .meta{color:var(--muted);font-size:.92rem;line-height:1.4} .card-actions{display:flex;gap:8px;margin-top:auto;padding-top:8px;flex-wrap:wrap} .card-actions .btn,.card-actions .linkbtn{flex:1;min-width:110px;padding:9px 10px;text-align:center}
  .practice{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px} .practice button{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;text-align:left;cursor:pointer;box-shadow:0 8px 22px rgba(31,45,85,.06)} .practice button b{display:block;margin-top:7px} .practice button span{font-size:1.7rem} .practice button small{color:var(--muted);display:block;margin-top:5px;line-height:1.35}
  .panel{background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:24px;margin-top:24px} .hidden{display:none!important}
  .lesson-head{display:grid;grid-template-columns:1.05fr .95fr;gap:24px;align-items:center} .lesson-art{border-radius:20px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,var(--accent2),#fff)} .lesson-art img{width:100%;display:block;max-height:520px;object-fit:contain}
  .lesson-head h1{font-size:clamp(2rem,4vw,3rem);margin:.25em 0} .reference{font-weight:800;color:var(--navy2)}
  .verse{margin:16px 0;padding:18px;border-left:5px solid var(--accent);background:#fffaf0;border-radius:0 14px 14px 0;line-height:1.65} .verse b{display:block;color:#805d00;margin-bottom:5px}
  .study-actions{display:flex;gap:8px;flex-wrap:wrap} .download-strip{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .qa-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px} .qa{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff} .qa b{display:block;margin-bottom:6px} .qa span{color:var(--good);font-weight:750}
  .object-lesson{margin-top:18px;background:#f7f9ff;border:1px solid #dfe4f7;border-radius:18px;padding:18px} .object-lesson h3{margin-top:0} .object-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px} .object-grid>div{background:#fff;border-radius:14px;padding:14px;border:1px solid var(--line)}
  .quiz-shell{max-width:800px;margin:24px auto 0} .quiz-top{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:10px} .progress{height:10px;background:#eceef6;border-radius:99px;overflow:hidden} .progress>div{height:100%;background:linear-gradient(90deg,var(--gold),#ffcf49);width:0;transition:.25s}
  .question-card{background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:26px;margin-top:14px} .q-label{font-size:.78rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)} .question-card h2{font-size:clamp(1.35rem,3.5vw,1.9rem);line-height:1.34;margin:.45em 0 1em}
  .options{display:grid;gap:10px} .option{border:2px solid #e1e4ef;background:#fff;border-radius:15px;padding:14px 16px;text-align:left;cursor:pointer;font-weight:700;color:var(--ink)} .option .tag{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#f2f4fb;margin-right:10px;font-size:.9rem}
  .option:hover{border-color:#aeb8dc;background:#f8f9ff} .option.correct{border-color:#70c7a0;background:#eaf8f1;color:#0e6840} .option.wrong{border-color:#df9696;background:#fff0f0;color:#9b2e2e} .option:disabled{cursor:default}
  .feedback{margin-top:14px;border-radius:14px;padding:14px;background:#f5f7fb;line-height:1.5} .feedback.good{background:#eaf8f1;color:#0c5e3b} .feedback.bad{background:#fff0f0;color:#842929}
  .quiz-next{margin-top:14px;display:flex;justify-content:flex-end} .flash-answer{font-size:1.25rem;color:var(--good);font-weight:850;padding:18px;background:#edf9f3;border-radius:14px;margin-top:10px} .flash-actions{display:flex;gap:8px;margin-top:12px} .flash-actions .btn{flex:1}
  .result{text-align:center} .result .big{font-size:4rem;font-weight:950;color:var(--navy2);line-height:1} .result p{color:var(--muted)} .result-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
  .empty{text-align:center;padding:36px;color:var(--muted)} .footer{text-align:center;color:var(--muted);font-size:.85rem;margin-top:34px}
  @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.practice{grid-template-columns:repeat(2,1fr)}.lesson-head{grid-template-columns:1fr}.qa-list{grid-template-columns:1fr}}
  @media(max-width:560px){.app{padding:10px 12px 45px}.brandtext small{display:none}.hero{padding:24px 20px;border-radius:24px}.grid{grid-template-columns:1fr}.practice{grid-template-columns:1fr 1fr}.topactions .xp{display:none}.panel{padding:17px}.question-card{padding:19px}.qa-list{grid-template-columns:1fr}.object-grid{grid-template-columns:1fr}.card-actions{flex-direction:column}}
</style>
</head>

<script>
const lessons = [{"id": 1, "ref": "1 Samuel 25", "img": "assets/lesson-1-self-lovers.jpg", "accent": "#d96d72", "accent2": "#f6cdd1", "en": {"title": "Lovers of Self", "example": "Nabal", "verseRef": "Philippians 2:4", "verse": "“Look not every man on his own things, but every man also on the things of others.”"}, "ta": {"title": "தற்பிரியர் (சுயநலவாதிகள்)", "example": "நாபால்", "verseRef": "பிலிப்பியர் 2:4", "verse": "“அவனவன் தனக்கானவைகளையல்ல, பிறருக்கானவைகளையும் நோக்குவானாக.”"}, "objectLesson": {"en": {"title": "Optional object lessons", "items": [{"name": "The Balloon Lesson", "text": "Write “ME” on a balloon. Keep blowing air into it and ask, “What happens if we keep filling it?” Eventually it pops. Lesson: pride and self-love keep saying, “More for me! More for me!” Soon everything bursts into trouble. Key statement: A life full of “ME” eventually pops."}, {"name": "The Cup That Only Takes vs. The Cup That Pours", "text": "Use two cups and a water pitcher. Fill Cup #1 to the top and say, “This cup only wants more and more.” Try to pour more—it spills. Fill Cup #2 halfway and pour from Cup #2 into other cups. Say, “This cup gives to others.” Teach: selfish people only want more; loving people pour into others. Acts 20:35: “It is more blessed to give than to receive.”"}]}, "ta": {"title": "விருப்பத்திற்கான பொருள் பாடங்கள்", "items": [{"name": "பலூன் பாடம்", "text": "ஒரு பலூனில் “நான்” என்று எழுதுங்கள். அதில் தொடர்ந்து காற்றை ஊதுங்கள். “இதை தொடர்ந்து நிரப்பினால் என்ன ஆகும்?” என்று கேளுங்கள். கடைசியில் அது வெடித்துவிடும். பாடம்: அகந்தையும் சுயநலமும் “எனக்கே இன்னும் வேண்டும்! எனக்கே இன்னும் வேண்டும்!” என்று சொல்லிக் கொண்டே இருக்கும். முடிவில் எல்லாம் சிக்கலாகிவிடும். முக்கிய கருத்து: “நான்” என்பதால் நிரம்பிய வாழ்க்கை இறுதியில் வெடித்துவிடும்."}, {"name": "எடுத்துக்கொண்டே இருக்கும் கப் மற்றும் ஊற்றும் கப்", "text": "இரண்டு கப்புகளையும் ஒரு தண்ணீர் ஜகரையும் பயன்படுத்துங்கள். முதல் கப்பை நிறைந்து வழியும் வரை நிரப்பி, “இந்தக் கப் இன்னும் இன்னும் வேண்டும் என்று மட்டுமே விரும்புகிறது” என்று சொல்லுங்கள். மேலும் ஊற்ற முயலுங்கள்—அது சிந்திவிடும். இரண்டாவது கப்பை பாதி வரை நிரப்பி, அதிலிருந்து மற்ற கப்புகளுக்குள் ஊற்றுங்கள். “இந்தக் கப் பிறருக்கு கொடுக்கிறது” என்று சொல்லுங்கள். கற்பிக்க வேண்டியது: சுயநலமுள்ளவர்கள் எப்போதும் இன்னும் வேண்டும் என்று விரும்புகிறார்கள்; அன்புள்ளவர்கள் பிறருக்குள் ஊற்றுகிறார்கள். அப்போஸ்தலர் 20:35: “பெறுவதிலும் கொடுப்பதே பாக்கியமுள்ளது.”"}]}}, "q": [{"qnum": 1, "en": {"q": "Who was the selfish man that did not help David?", "a": "Nabal", "options": ["Mordecai", "Haman", "Abigail", "Nabal"]}, "ta": {"q": "தாவீதுக்கு உதவாத சுயநலமான மனிதன் யார்?", "a": "நாபால்", "options": ["மோர்த்தெகாய்", "ஹாமான்", "அபிகாயில்", "நாபால்"]}}, {"qnum": 2, "en": {"q": "What does Nabal's name mean?", "a": "Fool", "options": ["Wise", "Fool", "Strong", "Kind"]}, "ta": {"q": "\"நாபால்\" என்ற பெயரின் அர்த்தம் என்ன?", "a": "மூடன்", "options": ["ஞானி", "மூடன்", "பலவான்", "நல்லவன்"]}}, {"qnum": 3, "en": {"q": "Who protected Nabal's shepherds?", "a": "David's men", "options": ["Saul's Men", "Philistines", "Moabites", "David's men"]}, "ta": {"q": "நாபாலின் மேய்ப்பர்களைப் பாதுகாத்தவர்கள் யார்?", "a": "தாவீதின் மனிதர்கள்", "options": ["சவுலின் படையினர்", "பெலிஸ்தியர்", "மோவாபியர்", "தாவீதின் மனிதர்கள்"]}}, {"qnum": 4, "en": {"q": "What did David ask from Nabal?", "a": "Food", "options": ["Sword", "Food", "Gold", "Land"]}, "ta": {"q": "தாவீது நாபாலிடம் என்ன கேட்டார்?", "a": "உணவு", "options": ["பட்டயம்", "உணவு", "பொன்", "நிலம்"]}}, {"qnum": 5, "en": {"q": "Did Nabal help David?", "a": "No", "options": ["Not stated", "Yes", "Only partly", "No"]}, "ta": {"q": "நாபால் தாவீதுக்கு உதவினானா?", "a": "இல்லை", "options": ["சொல்லப்படவில்லை", "ஆம்", "கொஞ்சம் மட்டும்", "இல்லை"]}}, {"qnum": 6, "en": {"q": "What did Nabal think mostly about?", "a": "Himself", "options": ["God", "Others", "Himself", "His enemies"]}, "ta": {"q": "நாபால் பெரும்பாலும் யாரைப்பற்றியே நினைத்தான்?", "a": "தன்னைப் பற்றியே", "options": ["தேவனைப் பற்றியே", "பிறரைப் பற்றியே", "தன்னைப் பற்றியே", "எதிரிகளைப் பற்றியே"]}}, {"qnum": 7, "en": {"q": "Who wisely intervened when David was on his way to punish Nabal?", "a": "Abigail", "options": ["Abigail", "Esther", "Paul", "Rabshakeh"]}, "ta": {"q": "தாவீது நாபாலைக் தண்டிக்கச் செல்லும் போது ஞானமாக தலையிட்டவர் யார்?", "a": "அபிகாயில்", "options": ["அபிகாயில்", "எஸ்தர்", "பவுல்", "ரப்ஷாகே"]}}, {"qnum": 8, "en": {"q": "How did Abigail help?", "a": "Brought food", "options": ["Brought food", "Rebuked Nabal", "Fought the Battle", "Hid David"]}, "ta": {"q": "அபிகாயில் எப்படி உதவினாள்?", "a": "உணவைக் கொண்டு வந்தாள்", "options": ["உணவைக் கொண்டு வந்தாள்", "நாபாலைக் கண்டித்தாள்", "போர் செய்தாள்", "தாவீதைக் மறைத்தாள்"]}}, {"qnum": 9, "en": {"q": "What happened to Nabal after hearing the news?", "a": "His heart became like a stone", "options": ["God's judgment", "He fled the country", "He repented", "His heart became like a stone"]}, "ta": {"q": "செய்தியைக் கேட்டபின் நாபாலுக்கு என்ன ஆனது?", "a": "அவன் இருதயம் கல்லைப் போல ஆனது", "options": ["தேவனின் தீர்ப்பு", "நாடு விட்டு ஓடினான்", "மனந்திரும்பினான்", "அவன் இருதயம் கல்லைப் போல ஆனது"]}}, {"qnum": 10, "en": {"q": "What happened ten days after his heart became like stone?", "a": "He died", "options": ["He recovered", "He apologized", "He died", "He moved away"]}, "ta": {"q": "அவன் இருதயம் கல்லைப் போல ஆன பத்து நாட்களுக்குப் பிறகு என்ன நடந்தது?", "a": "அவன் இறந்தான்", "options": ["அவன் குணமடைந்தான்", "அவன் மன்னிப்பு கேட்டான்", "அவன் இறந்தான்", "அவன் இடம் மாற்றினான்"]}}, {"qnum": 11, "en": {"q": "What trait Nabal show?", "a": "Self-love", "options": ["Generosity", "Courage", "Humility", "Self-love"]}, "ta": {"q": "நாபால் வெளிப்படுத்திய குணம் என்ன?", "a": "சுயநலம்", "options": ["தாராளம்", "தைரியம்", "தாழ்மை", "சுயநலம்"]}}, {"qnum": 12, "en": {"q": "What is the opposite of self-love?", "a": "Self-giving love", "options": ["Fear", "Contentment", "Pride", "Self-giving love"]}, "ta": {"q": "தன்னை நேசித்தலுக்கு எதிரான குணம் என்ன?", "a": "தன்னலமற்ற அன்பு", "options": ["பயம்", "திருப்தி", "அகம்பாவம்", "தன்னலமற்ற அன்பு"]}}, {"qnum": 13, "en": {"q": "Who is our perfect example of selfless love?", "a": "Jesus", "options": ["Moses", "Jesus", "Paul", "David"]}, "ta": {"q": "தன்னலமற்ற அன்பின் பரிபூரண முன்மாதிரி யார்?", "a": "இயேசு", "options": ["மோசே", "இயேசு", "பவுல்", "தாவீது"]}}, {"qnum": 14, "en": {"q": "A selfish person says, “_____ first.”", "a": "Me", "options": ["Family", "Others", "God", "Me"]}, "ta": {"q": "சுயநலமுள்ள ஒருவர், “முதலில் _____” என்று சொல்வார்.", "a": "நான்", "options": ["குடும்பம்", "பிறர்", "தேவன்", "நான்"]}}, {"qnum": 15, "en": {"q": "Jesus teaches us to put _____ first.", "a": "Others", "options": ["Wealth", "Others", "Comfort", "Me"]}, "ta": {"q": "இயேசு நமக்கு முதலில் யாரை வைக்கக் கற்பிக்கிறார்?", "a": "பிறரை", "options": ["செல்வம்", "பிறரை", "சுகம்", "நான்"]}}]}, {"id": 2, "ref": "Joshua 7", "img": "assets/lesson-2-covetous.jpg", "accent": "#c79e2f", "accent2": "#f6e7af", "en": {"title": "Covetous", "example": "Achan", "verseRef": "Hebrews 13:5", "verse": "“Let your conversation be without covetousness; and be content with such things as ye have: for he hath said, I will never leave thee, nor forsake thee.”"}, "ta": {"title": "பொருளாசையுள்ளவர்கள்", "example": "ஆகான்", "verseRef": "எபிரெயர் 13:5", "verse": "“நீங்கள் பண ஆசையில்லாதவர்களாய் நடந்து, உங்களுக்கு இருக்கிறவைகள் போதுமென்று எண்ணுங்கள்; நான் உன்னைவிட்டு விலகுவதுமில்லை, உன்னைக் கைவிடுவதுமில்லை என்று அவர் சொல்லியிருக்கிறாரே.”"}, "q": [{"qnum": 1, "en": {"q": "Who secretly took forbidden treasure?", "a": "Achan", "options": ["Nabal", "Caleb", "Haman", "Achan"]}, "ta": {"q": "தடைசெய்யப்பட்ட பொக்கிஷத்தை இரகசியமாக எடுத்தவன் யார்?", "a": "ஆகான்", "options": ["நாபால்", "காலேப்", "ஹாமான்", "ஆகான்"]}}, {"qnum": 2, "en": {"q": "Which city had Israel just conquered before Achan stole forbidden items?", "a": "Jericho", "options": ["Jericho", "Ai", "Gibeon", "Hebron"]}, "ta": {"q": "ஆகான் திருடுவதற்கு முன் இஸ்ரவேலர் வெற்றி கொண்ட நகரம் எது?", "a": "எரிகோ", "options": ["எரிகோ", " function lessonCard(l){const d=l[lang];return `<article class="card" style="--accent:${l.accent};--accent2:${l.accent2}"><div class="card-cover"><img src="${l.img}" alt="${esc(d.title)}"></div><div class="card-body"><div class="lesson-num">${esc(T('lesson'))} ${l.id}</div><h3>${esc(d.title)}</h3><div class="meta"><b>${esc(T('example'))}:</b> ${esc(d.example)} • ${esc(l.ref)}</div><div class="card-actions"><button class="btn secondary" onclick="openLesson(${l.id})">${esc(T('study'))}</button><button class="btn" onclick="startQuiz(${l.id},'mc')">${esc(T('quiz'))}</button><a class="linkbtn secondary" href="${l.img}" download>${esc(T('downloadPage'))}</a></div></div></article>`}
function openLesson(id){currentMode='lesson';currentLesson=id;renderLesson(id)}
function renderLesson(id){const l=lessons.find(x=>x.id===id),d=l[lang];const ol=l.objectLesson&&l.objectLesson[lang];document.getElementById('main').innerHTML=`<section class="panel" style="--accent:${l.accent};--accent2:${l.accent2}"><div class="lesson-head"><div><div class="lesson-num">${esc(T('lesson'))} ${l.id} • 2 Timothy 3:1–9</div><h1>${esc(d.title)}</h1><div class="reference">${esc(T('example'))}: ${esc(d.example)} (${esc(l.ref)})</div><div class="verse"><b>${esc(T('memory'))} — ${esc(d.verseRef)}</b>${esc(d.verse)}</div><div class="study-actions"><button class="btn" onclick="startQuiz(${l.id},'mc')">${esc(T('startMC'))}</button><button class="btn secondary" onclick="startQuiz(${l.id},'flash')">${esc(T('startFlash'))}</button><button class="btn secondary" onclick="goHome()">${esc(T('home'))}</button></div><div class="download-strip"><a class="linkbtn secondary" href="${l.img}" download>${esc(T('downloadPage'))}</a></div></div><div class="lesson-art"><img src="${l.img}" alt="${esc(d.title)} study illustration"></div></div>
<h2 style="margin-top:28px">${esc(T('questions'))}</h2><div class="qa-list">${l.q.map((q,i)=>`<div class="qa"><b>${i+1}. ${esc(q[lang].q)}</b><span>${esc(q[lang].a)}</span></div>`).join('')}</div>
${ol?`<div class="object-lesson"><h3>${esc(ol.title)}</h3><div class="object-grid">${ol.items.map(x=>`<div><b>${esc(x.name)}</b><p>${esc(x.text)}</p></div>`).join('')}</div></div>`:''}
</section>`;window.scrollTo(0,0)}
function startQuiz(scope,mode){currentMode=mode;currentLesson=scope==='all'||scope==='review'?null:Number(scope);let items;if(scope==='review'){const all=flatItems();items=all.filter(i=>mistakes.includes(itemKey(i)));if(!items.length){document.getElementById('main').innerHTML=`<div class="panel empty"><h2>${esc(T('review'))}</h2><p>${esc(T('noReview'))}</p><button class="btn" onclick="goHome()">${esc(T('home'))}</button></div>`;return}}else items=flatItems(scope==='all'?lessons.map(x=>x.id):[Number(scope)]);
 quizItems=shuffle(items).slice(0,Math.min(scope==='all'?15:10,items.length));qIndex=0;roundScore=0;streak=0;answered=false;renderQuiz();window.scrollTo(0,0)}
function renderQuiz(){if(qIndex>=quizItems.length){return renderResults()}const item=quizItems[qIndex],l=lessons.find(x=>x.id===item.lessonId),d=l[lang],qa=item[lang];const mode=currentMode==='mixed'?(qIndex%3===2?'flash':'mc'):currentMode==='review'?'mc':currentMode;const pct=(qIndex/quizItems.length)*100;document.getElementById('main').innerHTML=`<div class="quiz-shell"><div class="quiz-top"><button class="pill" onclick="${currentLesson?`openLesson(${currentLesson})`:'goHome()'}">← ${esc(currentLesson?T('lessonMenu'):T('home'))}</button><span class="pill">🔥 ${streak}</span></div><div class="progress"><div style="width:${pct}%"></div></div><div class="question-card"><div class="q-label">${esc(T('lesson'))} ${l.id}: ${esc(d.title)} • ${esc(T('question'))} ${qIndex+1} ${esc(T('of'))} ${quizItems.length}</div><h2>${esc(qa.q)}</h2>${mode==='flash'?flashUI(item):mcUI(item)}<div id="feedback"></div></div></div>`}
function flashUI(item){return `<button class="btn" id="revealBtn" onclick="revealFlash()">${esc(T('showAnswer'))}</button><div id="flashAnswer" class="hidden"></div>`}
function revealFlash(){const item=quizItems[qIndex],qa=item[lang];document.getElementById('revealBtn').classList.add('hidden');const box=document.getElementById('flashAnswer');box.className='';box.innerHTML=`<div class="flash-answer"><small>${esc(T('answer'))}</small><br>${esc(qa.a)}</div><div class="flash-actions"><button class="btn good" onclick="markFlash(true)">${esc(T('knew'))}</button><button class="btn bad" onclick="markFlash(false)">${esc(T('reviewAgain'))}</button></div>`}
function markFlash(knew){const item=quizItems[qIndex],key=itemKey(item);if(knew){roundScore++;streak++;xp+=10;mistakes=mistakes.filter(x=>x!==key)}else{streak=0;if(!mistakes.includes(key))mistakes.push(key)}save();nextQuestion()}
function mcUI(item){const labels=['A','B','C','D'];const opts=item[lang].options;return `<div class="options">${opts.map((o,i)=>`<button class="option" data-value="${esc(o)}" onclick="chooseOption(this)"><span class="tag">${labels[i]}</span>${esc(o)}</button>`).join('')}</div>`}
function chooseOption(btn){if(answered)return;answered=true;const item=quizItems[qIndex],correct=item[lang].a,key=itemKey(item);const buttons=[...document.querySelectorAll('.option')],chosen=btn.dataset.value;buttons.forEach(b=>{b.disabled=true;if(b.dataset.value===correct)b.classList.add('correct')});const ok=chosen===correct;if(!ok)btn.classList.add('wrong');if(ok){roundScore++;streak++;xp+=10;mistakes=mistakes.filter(x=>x!==key)}else{streak=0;if(!mistakes.includes(key))mistakes.push(key)}save();document.getElementById('feedback').innerHTML=`<div class="feedback ${ok?'good':'bad'}"><b>${esc(ok?T('correct'):T('wrong'))}</b><br>${esc(T('answer'))}: ${esc(correct)}</div><div class="quiz-next"><button class="btn" onclick="nextQuestion()">${esc(T('next'))} →</button></div>`}
function nextQuestion(){qIndex++;answered=false;renderQuiz();window.scrollTo({top:0,behavior:'smooth'})}
function renderResults(){const pct=Math.round((roundScore/quizItems.length)*100);const replayAction=(currentMode==='review')?"startQuiz('review','review')":(currentLesson?`startQuiz(${currentLesson},'${currentMode}')`:`startQuiz('all','${currentMode}')`);document.getElementById('main').innerHTML=`<div class="quiz-shell"><div class="panel result"><div class="eyebrow" style="color:var(--navy2)">${esc(T('finished'))}</div><div class="big">${pct}%</div><h2>${esc(T('score'))}: ${roundScore}/${quizItems.length}</h2><p>${xp} XP</p><div class="result-actions"><button class="btn" onclick="${replayAction}">${esc(T('again'))}</button>${mistakes.length?`<button class="btn secondary" onclick="startQuiz('review','review')">${esc(T('review'))} (${mistakes.length})</button>`:''}<button class="btn secondary" onclick="goHome()">${esc(T('home'))}</button></div></div></div>`}
renderTop();goHome();
</script>
</body>
</html>
